# Render Blueprint: one always-on service (API + UI + worker) and Postgres.
# The worker must run 24/7: free/sleeping instances would stop the 42-day schedule.
# Postgres can instead be Supabase Pro (pg_cron + pgvector): set DATABASE_URL to it
# and remove the database block. See bilan-knowledge/README.md.
services:
  - type: web
    name: bilan-knowledge
    runtime: docker
    dockerContext: ./bilan-knowledge
    dockerfilePath: ./bilan-knowledge/Dockerfile
    buildFilter:
      paths: ["bilan-knowledge/**"]
    plan: starter
    numInstances: 1
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bilan-knowledge-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DEPLOYMENT_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: APP_URL
        sync: false

databases:
  - name: bilan-knowledge-db
    plan: basic-256mb
